<!DOCTYPE html>
<html>
  <head>
    <title>Second HTML/CSS exercises</title>
    <style>
      .subscribe-button{
        background-color: rgb(203, 2, 2);
        color: white;
        border: none;
        height: 36px;
        width: 105px;
        border-radius: 5px;
        cursor: pointer;
      }
      .join-button{
        background-color: white;
        border: 1px solid rgb(9, 110, 225);
        height: 36px;
        width: 70px;
        color: rgb(5, 76, 197);
        border-radius: 3px;
        cursor: pointer;
      }
      .tweet-button{

      }
    </style>
  </head>
  <body>
    <button class="subscribe-button">Subscribe</button>
    <button class="join-button">Join</button>
    <button class="tweet-button">Tweet</button>
  </body>
</html>
