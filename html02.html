<!DOCTYPE html>
<html>
  <head>
    <title>Second HTML/CSS exercises</title>
    <style>
      body{
        margin-top: 40px;
        margin-left: 40px;
      }
      .subscribe-button{
        background-color: rgb(203, 2, 2);
        color: white;
        border: none;
        height: 36px;
        width: 105px;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 8px;
      }
      .join-button{
        background-color: white;
        border: 1px solid rgb(9, 110, 225);
        height: 36px;
        width: 70px;
        color: rgb(5, 76, 197);
        border-radius: 3px;
        cursor: pointer;
        margin-right: 8px;
      }
      .tweet-button{
        color: white;
        font-weight: bold;
        background-color: rgb(0, 123, 255);
        height: 36px;
        width: 70px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 15px;
      }

      .second-task{
        margin-top: 50px;
      }

      .amazon-link{
        color: blue;
        font-size: 18px;
      }

      .product-name{
        font-weight: bold;
        font-size: 20px;
      }
      .product-price{
        font-size: 19px;
        font-weight: bold;
        color: rgb(86, 222, 13);
      }
      .delivery-time{
        font-size: 18px;
      }
      .add-to-cart{
        background-color: rgb(255, 216, 20);
        font-size: 14px;
        border: none;
        height: 30px;
        padding: 3px 12px;
        border-radius: 15px;
        cursor: pointer;
      }
      .buy-now{
        background-color: rgb(255, 164, 28);
        height: 30px;
        border: none;
        padding: 3px 12px;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <button class="subscribe-button">Subscribe</button>
    <button class="join-button">Join</button>
    <button class="tweet-button">Tweet</button>

    <div class="second-task">
      <a href="https://www.amazon.com/" 
      class="amazon-link">Back to Amazon</a>

      <p class="product-name">Nike Black Running Shoes</p>
      <p class="product-price">$39 - in stock</p>
      <p class="delivery-time">Free delivery tomorrow</p>
      <button class="add-to-cart">Add to Cart</button>
      <button class="buy-now">Buy now</button>
    </div>
  </body>
</html>
